<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add and Manage</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f0f6ff; /* Light blue background */
      margin: 40px;
    }

    table {
      width: 90%;
      margin: auto;
      border-collapse: collapse;
      background: #ffffff; /* White table */
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      border-radius: 8px;
      overflow: hidden;
    }

    th, td {
      padding: 14px 18px;
      text-align: center;
    }

    th {
      background: #1e3a8a; /* Dark blue */
      color: white;
      font-size: 16px;
    }

    tr:nth-child(even) {
      background: #e0edff; /* Light blue row */
    }

    tr:hover {
      background: #d0e4ff; /* Slightly darker blue on hover */
    }

    .btn {
      padding: 6px 14px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.2s ease;
    }

    .btn-view {
      background-color: #2563eb; /* Blue */
      color: white;
    }

    .btn-view:hover {
      background-color: #1e40af; /* Darker blue */
    }

    .btn-response {
      background-color: #0ea5e9; /* Sky blue */
      color: white;
    }

    .btn-response:hover {
      background-color: #0369a1; /* Darker sky blue */
    }

    h2 {
      text-align: center;
      color: #1e3a8a; /* Dark blue */
    }
  </style>
</head>
<body>

  <h2>Add and Manage Table</h2>

  <table>
    <thead>
      <tr>
       
        <th>Name</th>
        <th>Email</th>
        <th>DOB</th>
         <th>Gender</th>
          <th>Phone.No</th>
          <th></th>
      </tr>
    </thead>
    <tbody>
      {% for i in users%}
      <tr>
        <td>{{i.fullname}}</td>
        <td>{{i.email}}</td>
        <td>{{i.date_of_birth}}</td>
        <td>{{i.gender}}</td>
        <td>{{i.phone_no}}</td>
        <td><a href="/deleteuser_delete/{{i.LOGIN_ID.id}}">Delete</a></td>
</tr>
{% endfor %}
</tbody>
</table>

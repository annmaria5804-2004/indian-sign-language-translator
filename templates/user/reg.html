<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Form</title>

<!-- Font Awesome -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #e3f2fd, #bbdefb, #90caf9);
    background-size: 400% 400%;
    animation: bgAnimation 15s ease infinite;
}

@keyframes bgAnimation {
    0% {background-position: 0% 50%;}
    50% {background-position: 100% 50%;}
    100% {background-position: 0% 50%;}
}

.login-container {
    background-color: white;
    border-radius: 15px;
    padding: 50px 40px;
    width: 360px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    animation: fadeIn 1s forwards;
}

@keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
}

.login-container h1 {
    margin-bottom: 30px;
    font-size: 32px;
    color: #1565c0;
}

.input-group {
    position: relative;
    margin-bottom: 22px;
    width: 100%;
}

.input-group input,
.input-group select {
    width: 100%;
    height: 45px;
    padding: 12px 42px 12px 15px;
    font-size: 15px;
    border: 1px solid #90caf9;
    border-radius: 8px;
    outline: none;
    background-color: #f5f9ff;
}

.input-group label {
    position: absolute;
    top: -8px;
    left: 12px;
    font-size: 12px;
    background: white;
    padding: 0 6px;
    color: #1976d2;
    pointer-events: none;
}

.input-group i {
    position: absolute;
    top: 50%;
    right: 14px;
    transform: translateY(-50%);
    color: #1976d2;
    font-size: 16px;
    cursor: pointer;
}

.error-text {
    color: red;
    font-size: 14px;
    margin-top: -12px;
    margin-bottom: 10px;
    display: none;
}

button {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    background-color: #1976d2;
    color: white;
    font-size: 16px;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.3s;
}

button:hover {
    background-color: #0d47a1;
}
</style>
</head>

<body>

<form class="login-container" onsubmit="return validatePasswords()" method="post"> 
     {% csrf_token %}
    <h1>User Details</h1>

    <!-- Name -->
    <div class="input-group">
        <input type="text" required name="name">
        <label>Name</label>
        <i class="fas fa-user"></i>
    </div>

    <!-- Email -->
    <div class="input-group">
        <input type="email" required name="email">
        <label>Email</label>
        <i class="fas fa-envelope"></i>
    </div>

    <!-- Date of Birth -->
    <div class="input-group">
        <input type="date" name="dob" required>
        <label>Date of Birth</label>
        <i class="fas fa-calendar"></i>
    </div>

    <!-- Gender -->
    <div class="input-group">
        <select required name="gender">
            <option value="" disabled selected>Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>
        <label>Gender</label>
        <i class="fas fa-venus-mars"></i>
    </div>

    <!-- Phone -->
    <div class="input-group">
        <input type="tel" pattern="[0-9]{10}" required name="phone">
        <label>Phone Number</label>
        <i class="fas fa-phone"></i>
    </div>

    <!-- Password -->
    <div class="input-group">
        <input type="password" id="password" minlength="6" required name="password">
        <label>Password</label>
        <i class="fas fa-eye" onclick="togglePassword('password', this)"></i>
    </div>

    <!-- Confirm Password -->
    <div class="input-group">
        <input type="password" id="confirm_password" minlength="6" required>
        <label>Confirm Password</label>
        <i class="fas fa-eye" onclick="togglePassword('confirm_password', this)"></i>
    </div>

    <!-- Error Message -->
    <div id="password-error" class="error-text">
        Passwords do not match
    </div>

    <button type="submit">Submit</button>
</form>

<script>
function togglePassword(id, icon) {
    const input = document.getElementById(id);
    if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
    } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
    }
}

function validatePasswords() {
    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirm_password").value;
    const error = document.getElementById("password-error");

    if (password !== confirmPassword) {
        error.style.display = "block";
        return false; // Stop form submission
    }

    
}
</script>

</body>
</html>

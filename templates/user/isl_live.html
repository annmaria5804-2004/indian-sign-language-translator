{% extends "user/userdash.html" %}

{% block title %}ISL Real-Time Recognition{% endblock %}
{% block header %}ISL Real-Time Recognition{% endblock %}

{% block content %}

<style>
  .isl-container {
    text-align: center;
    background: #0b1d3a;
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.4);
  }

  .isl-container h1 {
    color: #00c6ff;
    margin-bottom: 25px;
  }

  .video-box img {

    max-width: 100%;
  }

<div class="isl-container">
  <h1>🖐️ ISL Real-Time Recognition</h1>

  <div class="video-box">
    <img src="{% url 'video_feed' %}" width="720">
  </div>

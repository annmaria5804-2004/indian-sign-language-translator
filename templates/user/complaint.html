{% extends "user/userdash.html" %}

{% block title %}Complaint{% endblock %}
{% block header %}Complaint{% endblock %}

{% block content %}

<style>
  .complaint-container {
    max-width: 600px;
    margin: auto;
    background: #ffffff;
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
  }

  .complaint-container h1 {
    text-align: center;
    color: #1565c0;
    margin-bottom: 30px;
  }

  .input-group {
    position: relative;
    margin-bottom: 25px;
  }

  .input-group textarea {
    width: 100%;
    height: 130px;
    padding: 14px;
    font-size: 15px;
    border-radius: 8px;
    border: 1px solid #90caf9;
    outline: none;
    resize: none;
    background: #f5f9ff;
  }

  .input-group label {
    position: absolute;
    top: -8px;
    left: 12px;
    font-size: 12px;
    background: white;
    padding: 0 6px;
    color: #1976d2;
  }

  button {
    width: 100%;
    padding: 12px;
    border-radius: 25px;
    border: none;
    background: linear-gradient(90deg, #004aad, #2a73ff);
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
  }

  button:hover {
    opacity: 0.9;
    transform: translateY(-2px);
  }
</style>

<div class="complaint-container">
  <h1>Register Complaint</h1>

  <form method="post">
    {% csrf_token %}

    <div class="input-group">
      <textarea name="complaint" required></textarea>
      <label>Complaint</label>
    </div>

    <button type="submit">Submit Complaint</button>
  </form>
</div>

{% endblock %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Forgot Password | ISL System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #b3d1ff, #e8f0ff, #d6e4ff);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      background: #ffffff;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0,0,80,0.25);
      animation: fadeIn 1s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h2 {
      text-align: center;
      color: #004aad;
      margin-bottom: 25px;
    }

    label {
      font-weight: 500;
      color: #333;
      margin-top: 15px;
      display: block;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border-radius: 10px;
      border: 1px solid #ccc;
      outline: none;
      transition: 0.3s;
    }

    input:focus {
      border-color: #004aad;
      box-shadow: 0 0 5px rgba(0,74,173,0.3);
    }

    button {
      margin-top: 25px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #004aad, #007bff);
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: 0.3s;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(0,74,173,0.4);
    }

    .back-link {
      text-align: center;
      margin-top: 18px;
    }

    .back-link a {
      text-decoration: none;
      color: #004aad;
      font-weight: 500;
    }

    .back-link a:hover {
      text-decoration: underline;
    }

    .messages {
      margin-bottom: 15px;
    }

    .messages p {
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .messages .error {
      background: #ffe1e1;
      color: #b30000;
    }

    .messages .success {
      background: #e1ffe6;
      color: #006b2e;
    }
  </style>
</head>

<body>

  <div class="container">

    <h2>🔐 Forgot Password</h2>

   

    <form method="post">
      {% csrf_token %}

      <label>Email</label>
      <input type="email" name="email" required>


      <button type="submit">Submit</button>
    </form>

 

  </div>

</body>
</html>
